<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1436" viewBox="0 0 1000 1436" role="img" aria-labelledby="title description">
<title id="title">Codex V1 memory workflow with source functions</title>
<desc id="description">Codex memory V1 at commit c3d3b14. Function headings link to their source definitions; comments describe the work. A new turn starts background processing of eligible earlier chats. Extraction stores session recaps and candidate findings in the database. Consolidation organizes selected inputs into memory_summary.md and MEMORY.md. Initial context includes a memory summary with an estimated token budget and lookup instructions; the model can retrieve detailed memory during a task. Parsed citations with valid session IDs can update usage for future selection. Explicit notes enter consolidation directly. This diagram shows a successful path; startup checks, skipped work and optional paths are condensed.</desc>
