<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1430" viewBox="0 0 440 1430" role="img" aria-labelledby="title description">
<title id="title">A task becomes a child</title>
<desc id="description">Codex V2 delegation at commit c3d3b14. Function headings link to their definitions; comments describe the depicted fresh-history example. The spawn handler parses the parent model&#x27;s request; child configuration is prepared and the local controller creates a separate conversation and admits its task. Parent and child use the same run_turn function with independent conversation histories and a shared workspace. After successful child completion, the controller formats its last assistant message and sends a queue-only result to the parent mailbox. The parent records delivered mail into history for its next accepted model step. Waiting observes activity; final-answer output can defer mail to the next turn. Startup details and optional history copying are condensed.</desc>
