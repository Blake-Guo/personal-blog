<svg width="1600" height="620" viewBox="0 0 1600 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Two delegation behaviors behind the term subagent</title>
  <desc id="desc">With an OpenAI agent as a tool or a Deep Agents task subagent, the flow is user to main agent to specialist, then back to the main agent and user. With an OpenAI handoff, the flow is user to triage agent to specialist, and the specialist replies directly to the user.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#173B66" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M1 1L9 5.5L1 10" stroke="#2D7BE8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </marker>
    <marker id="arrow-green" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M1 1L9 5.5L1 10" stroke="#16856B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </marker>
    <style>
      .title { font: 700 29px -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif; fill: #153253; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif; fill: #536B86; }
      .row-title { font: 700 18px -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif; fill: #153253; }
      .row-note { font: 500 14px -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif; fill: #536B86; }
      .node-title { font: 650 17px -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif; fill: #153253; }
      .node-detail { font: 400 13px -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif; fill: #61758B; }
      .edge-label { font: 600 12px -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif; fill: #536B86; }
      .blue { stroke: #2D7BE8; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .green { stroke: #16856B; stroke-width: 2.2; fill: none; marker-end: url(#arrow-green); }
    </style>
  </defs>

  <rect width="1600" height="620" rx="28" fill="#F8FBFF"/>
  <text x="80" y="65" class="title">Two behaviors behind “subagent”</text>
  <text x="80" y="96" class="subtitle">Does the specialist return a result, or become the active agent?</text>

  <!-- Manager pattern -->
  <rect x="80" y="135" width="1440" height="190" rx="22" fill="#F1F6FC" stroke="#BFD5EF"/>
  <text x="115" y="175" class="row-title">Specialist returns to the manager</text>
  <text x="115" y="200" class="row-note">OpenAI Agent.as_tool() · Deep Agents task() subagent</text>

  <g filter="url(#shadow)">
    <rect x="115" y="225" width="160" height="70" rx="14" fill="white" stroke="#C8DAEE"/>
    <text x="172" y="267" class="node-title">User</text>
  </g>
  <path d="M275 260H355" class="blue"/>
  <g filter="url(#shadow)">
    <rect x="368" y="225" width="230" height="70" rx="14" fill="white" stroke="#BFD5EF"/>
    <text x="439" y="254" class="node-title">Main agent</text>
    <text x="402" y="279" class="node-detail">owns the conversation</text>
  </g>
  <path d="M598 247H700" class="blue"/>
  <text x="619" y="235" class="edge-label">delegate</text>
  <g filter="url(#shadow)">
    <rect x="713" y="225" width="235" height="70" rx="14" fill="white" stroke="#BFD5EF"/>
    <text x="777" y="254" class="node-title">Specialist</text>
    <text x="744" y="279" class="node-detail">does the delegated work</text>
  </g>
  <path d="M948 275H1060" class="blue"/>
  <text x="978" y="300" class="edge-label">result</text>
  <g filter="url(#shadow)">
    <rect x="1073" y="225" width="230" height="70" rx="14" fill="#E9F3FF" stroke="#AFCDEA"/>
    <text x="1144" y="254" class="node-title">Main agent</text>
    <text x="1118" y="279" class="node-detail">uses the result and replies</text>
  </g>
  <path d="M1303 260H1390" class="blue"/>
  <g filter="url(#shadow)">
    <rect x="1403" y="225" width="82" height="70" rx="14" fill="white" stroke="#C8DAEE"/>
    <text x="1425" y="267" class="node-title">User</text>
  </g>

  <!-- Handoff pattern -->
  <rect x="80" y="365" width="1440" height="190" rx="22" fill="#F2F9F6" stroke="#BBDCCF"/>
  <text x="115" y="405" class="row-title">Specialist becomes the active agent</text>
  <text x="115" y="430" class="row-note">OpenAI handoff · same top-level run</text>

  <g filter="url(#shadow)">
    <rect x="115" y="455" width="210" height="70" rx="14" fill="white" stroke="#BBDCCF"/>
    <text x="185" y="497" class="node-title">User</text>
  </g>
  <path d="M325 490H535" class="green"/>
  <g filter="url(#shadow)">
    <rect x="548" y="455" width="260" height="70" rx="14" fill="white" stroke="#BBDCCF"/>
    <text x="618" y="484" class="node-title">Triage agent</text>
    <text x="602" y="509" class="node-detail">changes active agent</text>
  </g>
  <path d="M808 490H1008" class="green"/>
  <text x="875" y="476" class="edge-label">handoff</text>
  <g filter="url(#shadow)">
    <rect x="1020" y="455" width="270" height="70" rx="14" fill="white" stroke="#BBDCCF"/>
    <text x="1090" y="484" class="node-title">Specialist agent</text>
    <text x="1090" y="509" class="node-detail">takes over and replies</text>
  </g>
  <path d="M1290 490H1348" class="green"/>
  <g filter="url(#shadow)">
    <rect x="1360" y="455" width="125" height="70" rx="14" fill="#E6F5EF" stroke="#AAD4C3"/>
    <text x="1402" y="497" class="node-title">User</text>
  </g>
</svg>
